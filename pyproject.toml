[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intel-pipeline"
version = "1.1.1"
description = "Evidence-constrained company intelligence using Playwright and strict LLM tools"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
company-intel = "company_intel.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["company_intel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
